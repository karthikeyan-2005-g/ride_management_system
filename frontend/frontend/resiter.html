<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - RentalCars</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gray-950 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">

            <a href="/Users/ELCOT/Desktop/car_rental_management/index.html"
               class="text-2xl font-bold">
                🚗 RentalCars
            </a>

            <div class="flex gap-6">
                <a href="/index.html"
                   class="hover:text-green-400">
                    Home
                </a>

                <a href="./cars.html"
                   class="hover:text-green-400">
                    Cars
                </a>

                <a href="./login.html"
                   class="hover:text-green-400">
                    Login
                </a>
            </div>

        </div>
    </nav>


    <!-- Register Section -->
    <div class="min-h-[calc(100vh-80px)] flex items-center justify-center px-4">

        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-8">

            <h1 class="text-3xl font-bold text-center text-gray-900 mb-2">
                Create Account
            </h1>

            <p class="text-center text-gray-500 mb-8">
                Register for your RentalCars account
            </p>


            <!-- Register Form -->
            <form id="registerForm">

                <!-- Name -->
                <div class="mb-5">

                    <label class="block text-gray-700 font-semibold mb-2">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-green-500"
                    >

                </div>


                <!-- Email -->
                <div class="mb-5">

                    <label class="block text-gray-700 font-semibold mb-2">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-green-500"
                    >

                </div>


                <!-- Password -->
                <div class="mb-5">

                    <label class="block text-gray-700 font-semibold mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-green-500"
                    >

                </div>


                <!-- Confirm Password -->
                <div class="mb-6">

                    <label class="block text-gray-700 font-semibold mb-2">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-green-500"
                    >

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="w-full bg-green-600 hover:bg-green-700
                           text-white font-bold py-3 rounded-lg
                           transition duration-200">

                    Create Account

                </button>

            </form>


            <!-- Login Link -->
            <p class="text-center text-gray-600 mt-6">

                Already have an account?

                <a href="login.html"
                   class="text-green-600 font-semibold hover:underline">
                    Login
                </a>

            </p>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        document.getElementById("registerForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            // Get form values
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;


            // Check password
            if (password !== confirmPassword) {

                alert("Passwords do not match.");

                return;
            }


            // Password length
            if (password.length < 6) {

                alert("Password must be at least 6 characters.");

                return;
            }


            try {

                // Connect to Flask backend
                const response = await fetch(
                    "http://127.0.0.1:5000/api/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password
                        })
                    }
                );


                // Get backend response
                const result = await response.json();


                // Registration successful
                if (response.ok) {

                    alert("Registration successful!");

                    // Save user information
                    if (result.user) {

                        localStorage.setItem(
                            "user_id",
                            result.user.id
                        );

                        localStorage.setItem(
                            "user_name",
                            result.user.name
                        );

                        localStorage.setItem(
                            "user_email",
                            result.user.email
                        );
                    }


                    // Go to login page
                    window.location.href = "login.html";

                }

                // Registration failed
                else {

                    alert(
                        result.message ||
                        "Registration failed."
                    );
                }


            } catch (error) {

                console.error("Registration Error:", error);

                alert(
                    "Unable to connect to server. " +
                    "Please make sure Flask server is running."
                );

            }

        });

    </script>

</body>
</html>
