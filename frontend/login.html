<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - RentalCars</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen
             bg-gradient-to-br
             from-blue-600
             to-blue-900
             flex items-center
             justify-center
             px-6">


    <!-- Login Card -->

    <div class="w-full max-w-md
                bg-white
                rounded-2xl
                shadow-2xl
                p-8">


        <!-- Logo -->

        <div class="text-center mb-8">

            <div class="text-5xl mb-3">
                🚗
            </div>

            <h1 class="text-3xl
                       font-bold">

                Welcome Back

            </h1>

            <p class="text-gray-500 mt-2">

                Login to your RentalCars account

            </p>

        </div>


        <!-- Login Form -->

        <form id="loginForm">


            <!-- Email -->

            <div class="mb-5">

                <label class="block
                              font-semibold
                              mb-2">

                    Email Address

                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    class="w-full
                           border
                           border-gray-300
                           rounded-lg
                           px-4 py-3
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-500">

            </div>


            <!-- Password -->

            <div class="mb-5">

                <div class="flex
                            justify-between
                            mb-2">

                    <label class="font-semibold">

                        Password

                    </label>

                    <a href="#"
                       class="text-blue-600
                              text-sm
                              hover:underline">

                        Forgot Password?

                    </a>

                </div>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                    class="w-full
                           border
                           border-gray-300
                           rounded-lg
                           px-4 py-3
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-500">

            </div>


            <!-- Remember -->

            <div class="flex
                        items-center
                        mb-6">

                <input
                    type="checkbox"
                    class="w-4 h-4">

                <label class="ml-2
                              text-gray-600">

                    Remember me

                </label>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="w-full
                       bg-blue-600
                       hover:bg-blue-700
                       text-white
                       py-3
                       rounded-lg
                       font-bold
                       transition">

                Login

            </button>

        </form>


        <!-- Register -->

        <p class="text-center
                  text-gray-600
                  mt-6">

            Don't have an account?

            <a href="./resiter.html"
               class="text-blue-600
                      font-semibold
                      hover:underline">

                Create Account

            </a>

        </p>


        <!-- Back Home -->

        <div class="text-center mt-5">

            <a href="../index.html"
               class="text-gray-500
                      hover:text-blue-600">

                ← Back to Home

            </a>

        </div>

    </div>


    <!-- JavaScript -->

    <script>

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();

                    const email =
                        document.getElementById(
                            "email"
                        ).value;

                    const password =
                        document.getElementById(
                            "password"
                        ).value;


                    if (email && password) {

                        alert(
                            "Login successful!"
                        );

                        window.location.href =
                            "/index.html";

                    }

                }
            );

    </script>

</body>

</html>
